<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email Checker</title>
<style>
	:root {
		--bg: #f6f7f9; --card: #ffffff; --text: #1a1d23; --muted: #626b78; --border: #dde1e7;
		--accent: #2f6fe4; --accent-text: #ffffff;
		--safe: #1f8a4c; --safe-bg: #e6f4ec; --risky: #a86200; --risky-bg: #fdf1dd;
		--invalid: #c4352b; --invalid-bg: #fbe7e5; --unknown: #5b6472; --unknown-bg: #eceef1;
		color-scheme: light;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #14161a; --card: #1d2026; --text: #e8eaee; --muted: #9aa3b0; --border: #2e333b;
			--accent: #5b8ff0;
			--safe: #5cc98a; --safe-bg: #17301f; --risky: #f0b04a; --risky-bg: #33280f;
			--invalid: #f07a70; --invalid-bg: #3a1c1a; --unknown: #aab2be; --unknown-bg: #2a2e35;
			color-scheme: dark;
		}
	}
	* { box-sizing: border-box; }
	body {
		margin: 0; background: var(--bg); color: var(--text);
		font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		padding: 48px 16px;
	}
	main { max-width: 560px; margin: 0 auto; }
	h1 { font-size: 24px; margin: 0 0 4px; }
	.sub { color: var(--muted); margin: 0 0 24px; }
	form { display: flex; gap: 8px; flex-wrap: wrap; }
	input {
		flex: 1 1 260px; min-width: 0; padding: 12px 14px; font-size: 16px;
		border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text);
	}
	input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
	button {
		padding: 12px 22px; font-size: 16px; font-weight: 600; border: 0; border-radius: 8px;
		background: var(--accent); color: var(--accent-text); cursor: pointer;
	}
	button:disabled { opacity: .6; cursor: wait; }
	.card {
		margin-top: 24px; background: var(--card); border: 1px solid var(--border);
		border-radius: 12px; padding: 20px;
	}
	.badge {
		display: inline-block; padding: 4px 12px; border-radius: 999px;
		font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .04em;
	}
	.safe { color: var(--safe); background: var(--safe-bg); }
	.risky { color: var(--risky); background: var(--risky-bg); }
	.invalid { color: var(--invalid); background: var(--invalid-bg); }
	.unknown { color: var(--unknown); background: var(--unknown-bg); }
	.email { font-weight: 600; margin: 12px 0 2px; word-break: break-all; }
	.explain { color: var(--muted); margin: 0 0 16px; }
	dl { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; margin: 0; }
	dt { color: var(--muted); }
	dd { margin: 0; font-weight: 600; text-align: right; }
	.yes { color: var(--safe); } .no { color: var(--invalid); } .na { color: var(--muted); font-weight: 400; }
	details { margin-top: 16px; }
	summary { cursor: pointer; color: var(--muted); }
	pre {
		overflow-x: auto; background: var(--bg); border: 1px solid var(--border);
		border-radius: 8px; padding: 12px; font-size: 12px;
	}
	.error { color: var(--invalid); }
	.note { color: var(--muted); font-size: 13px; margin-top: 24px; }
</style>
</head>
<body>
<main>
	<h1>Email Checker</h1>
	<p class="sub">Checks whether an email address exists, without sending any email.</p>

	<form id="form">
		<input id="email" type="email" placeholder="name@example.com" required autocomplete="off" autofocus>
		<button id="btn" type="submit">Check</button>
	</form>

	<div id="out"></div>

	<p class="note">Most checks take 2–10 seconds. Outlook, Hotmail and Yahoo addresses are not supported yet and will time out. Limit: 10 checks per minute, 300 per day.</p>
</main>

<script>
	const EXPLAIN = {
		safe: "The mailbox exists and accepts email.",
		risky: "The address may work, but it is risky: a catch-all domain, disposable, shared (role) address, or full inbox.",
		invalid: "The address does not exist or cannot receive email.",
		unknown: "Could not tell. The mail server did not give a clear answer."
	};
	const form = document.getElementById("form");
	const input = document.getElementById("email");
	const btn = document.getElementById("btn");
	const out = document.getElementById("out");

	function esc(s) {
		return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
	}
	function flag(v, good) {
		if (v === undefined || v === null) return '<span class="na">—</span>';
		const ok = good ? v : !v;
		return `<span class="${ok ? "yes" : "no"}">${v ? "Yes" : "No"}</span>`;
	}

	form.addEventListener("submit", async (e) => {
		e.preventDefault();
		const email = input.value.trim();
		if (!email) return;
		btn.disabled = true;
		btn.textContent = "Checking…";
		out.innerHTML = `<div class="card">Checking <b>${esc(email)}</b>…</div>`;
		try {
			const res = await fetch("/api/check", {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ to_email: email })
			});
			const text = await res.text();
			if (!res.ok) {
				let msg = text;
				if (res.status === 429) msg = "Too many checks. Wait a minute and try again.";
				else if (res.status === 504) msg = "The check took too long and was stopped. This happens with Outlook, Hotmail and Yahoo addresses.";
				else { try { msg = JSON.parse(text).error || text; } catch (_) {} }
				out.innerHTML = `<div class="card error">Error ${res.status}: ${esc(msg)}</div>`;
				return;
			}
			const r = JSON.parse(text);
			const status = r.is_reachable || "unknown";
			out.innerHTML = `
				<div class="card">
					<span class="badge ${esc(status)}">${esc(status)}</span>
					<p class="email">${esc(r.input || email)}</p>
					<p class="explain">${esc(EXPLAIN[status] || "")}</p>
					<dl>
						<dt>Valid format</dt><dd>${flag(r.syntax?.is_valid_syntax, true)}</dd>
						<dt>Domain has a mail server</dt><dd>${flag(r.mx?.accepts_mail, true)}</dd>
						<dt>Mailbox exists</dt><dd>${flag(r.smtp?.is_deliverable, true)}</dd>
						<dt>Catch-all domain (accepts anything)</dt><dd>${flag(r.smtp?.is_catch_all, false)}</dd>
						<dt>Disposable / temporary address</dt><dd>${flag(r.misc?.is_disposable, false)}</dd>
						<dt>Shared role address (info@, support@…)</dt><dd>${flag(r.misc?.is_role_account, false)}</dd>
						<dt>Mailbox disabled</dt><dd>${flag(r.smtp?.is_disabled, false)}</dd>
					</dl>
					<details><summary>Full details</summary><pre>${esc(JSON.stringify(r, null, 2))}</pre></details>
				</div>`;
		} catch (err) {
			out.innerHTML = `<div class="card error">Could not reach the checker. Is the reacher-public container running? (${esc(err.message)})</div>`;
		} finally {
			btn.disabled = false;
			btn.textContent = "Check";
		}
	});
</script>
</body>
</html>
